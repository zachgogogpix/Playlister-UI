<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playlister by Vibe Stream</title>
  <link rel="icon" type="image/png" href="/favicon.png" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MQPYK613JC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-MQPYK613JC');
  </script>

  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-brand">
        <img src="/favicon.png" class="brand-logo" alt="Vibe Stream" />
        <span class="brand-name">Playlister by Vibe Stream</span>
      </div>
      <nav class="tab-nav">
        <button class="tab-btn active" data-tab="videos">Videos</button>
        <button class="tab-btn" data-tab="playlists">Playlists</button>
      </nav>
    </header>

    <main id="main-content">
      <div id="tab-videos" class="tab-panel active"></div>
      <div id="tab-playlists" class="tab-panel"></div>
    </main>
  </div>

  <footer class="app-footer">
    <span>Playlister by Vibe Stream</span>
    <span class="footer-version">v0.8</span>
  </footer>

  <!-- Global overlay containers -->
  <div id="modal-backdrop" class="modal-backdrop hidden"></div>
  <div id="modal-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
